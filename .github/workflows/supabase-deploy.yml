name: Supabase Deploy

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "src/utils/**"
      - ".github/workflows/supabase-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_PROJECT_REF: dzboqhobrmzglyuofcyk
      SUPABASE_FUNCTION_NAME: webhook-listener
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Run platform test suites
        run: |
          node --experimental-strip-types tests/run-tests.ts
          node --experimental-strip-types tests/webhookTest.test.ts
          npm run test:webhook-signals

      - name: Run isolated database verification (PGlite)
        run: |
          npm install --prefix tmp/webhook-db-verification --no-save @electric-sql/pglite
          node tests/optionSignalDatabase.test.mjs

      - name: Type check edge function
        run: deno check --node-modules-dir=none supabase/functions/webhook-listener/index.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Push database migrations
        run: supabase db push

      - name: Deploy edge function
        run: supabase functions deploy "$SUPABASE_FUNCTION_NAME" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
